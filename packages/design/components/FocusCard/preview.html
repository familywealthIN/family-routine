<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus card</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  body { margin: 0; padding: 20px 16px; background: var(--bg-app); font-family: var(--family-sans); color: var(--text); }
  .card { max-width: 380px; background: var(--surface); border-radius: var(--radius-card); box-shadow: var(--shadow-card); overflow: hidden; padding-top: 14px; }
  .inner { padding: 0 16px; }
  .tick { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 0 10px; }
  .ring { position: relative; width: 120px; height: 120px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .centre { position: absolute; inset: 10px; border-radius: 50%; background: var(--now-tint); display: flex; align-items: center; justify-content: center; color: var(--now); }
  .ring .centre .mi { font-size: 32px; }
  .title { font: 700 19px/1.3 var(--family-sans); text-align: center; }
  .meta { font: var(--font-meta); color: var(--text-secondary); text-align: center; display: flex; gap: 6px; justify-content: center; align-items: center; }
  .now { font: 700 9px/1.5 var(--family-sans); letter-spacing: .4px; padding: 1px 6px; border-radius: var(--radius-pill); background: rgba(255,152,0,.14); color: var(--now-dark); }
  .head { margin-top: 4px; border-top: 1px solid var(--divider); padding: 8px 0 4px; display: flex; justify-content: space-between; align-items: center; }
  .head-label { font: 700 12px/1 var(--family-sans); letter-spacing: .5px; color: rgba(0,0,0,.5); }
  .head-count { font-size: 12px; color: var(--text-secondary); }
  .head-count b { color: var(--text); }
  .segments { display: flex; gap: 3px; margin: 6px 0 4px; }
  .segment { flex: 1; height: 4px; border-radius: 2px; background: rgba(0,0,0,.08); }
  .segment--done { background: var(--success); }
  .row { display: flex; align-items: center; gap: 10px; min-height: 42px; border-top: 1px solid var(--divider); }
  .box { font-size: 24px; color: rgba(0,0,0,.54); }
  .box--done { color: var(--success); }
  .row-text { flex: 1; min-width: 0; font: 500 15px/1.3 var(--family-sans); }
  .row-text--done { text-decoration: line-through; color: var(--text-tertiary); }
  .add { display: flex; align-items: center; gap: 10px; min-height: 42px; border-top: 1px solid var(--divider); color: var(--primary); font: 600 15px/1 var(--family-sans); }
  .tabs { display: flex; background: var(--surface-subtler); margin-top: 2px; }
  .tab { flex: 1; height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-top: 2px solid transparent; color: var(--text-secondary); font: 600 11px/1 var(--family-sans); }
  .tab .mi { font-size: 18px; }
  .tab--active { color: var(--primary); border-top-color: var(--primary); }
</style>
</head>
<body>
  <div class="card">
    <div class="inner">
      <div class="tick">
        <div class="ring">
          <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" fill="none" stroke="rgba(0,0,0,.06)" stroke-width="6"/><circle cx="60" cy="60" r="56" fill="none" stroke="#FF9800" stroke-width="6" stroke-linecap="round" stroke-dasharray="351.86" stroke-dashoffset="175.93"/></svg>
          <div class="centre"><span class="mi">check</span></div>
        </div>
        <div class="title">Deep Work</div>
        <div class="meta"><span>09:00 – 12:00</span><span class="now">NOW</span></div>
      </div>
      <div class="head"><span class="head-label">CHECKLIST</span><span class="head-count"><b>1</b>/3</span></div>
      <div class="segments"><span class="segment segment--done"></span><span class="segment"></span><span class="segment"></span></div>
      <div class="row"><span class="mi box box--done">check_box</span><span class="row-text row-text--done">Ship dashboard PR</span></div>
      <div class="row"><span class="mi box">check_box_outline_blank</span><span class="row-text">Draft the pricing page</span></div>
      <div class="row"><span class="mi box">check_box_outline_blank</span><span class="row-text">Email two beta users</span></div>
      <div class="add"><span class="mi" style="font-size:22px">add</span>Add task</div>
    </div>
    <div class="tabs">
      <div class="tab tab--active"><span class="mi">today</span>Today</div>
      <div class="tab"><span class="mi">view_week</span>Week</div>
      <div class="tab"><span class="mi">calendar_month</span>Month</div>
      <div class="tab"><span class="mi">event_repeat</span>Year</div>
    </div>
  </div>
</body>
</html>
