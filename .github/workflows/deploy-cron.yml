name: Deploy Cron (n8n)

# Ships apps/cron, the notification senders, to the n8n host and keeps the
# Lifecycle Notifications workflow active. Everything happens in
# scripts/deploy-cron.sh (runbook: docs/n8n/DEPLOY.md); this job supplies the
# credentials. No step sends a push: the verify is dry runs only.

on:
  push:
    branches: [master]
    paths:
      - 'apps/cron/**'
      - 'scripts/deploy-cron.sh'
      - 'docs/n8n/6-lifecycle-notifications.json'
      - '.github/workflows/deploy-cron.yml'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Only inspect the host (changes nothing)'
        type: boolean
        default: true

# One deploy at a time: two overlapping runs would back up and copy over each other.
concurrency:
  group: deploy-cron
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight — verify deploy secrets are configured
        env:
          CRON_SSH_KEY: ${{ secrets.CRON_SSH_KEY }}
          CRON_SSH_KNOWN_HOSTS: ${{ secrets.CRON_SSH_KNOWN_HOSTS }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          CRON_VERIFY_EMAIL: ${{ secrets.CRON_VERIFY_EMAIL }}
        run: |
          missing=()
          for name in CRON_SSH_KEY CRON_SSH_KNOWN_HOSTS N8N_API_KEY CRON_VERIFY_EMAIL; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
              echo "::error title=Missing repository secret::$name is not set"
            else
              echo "$name: set"
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "### Deploy Cron cannot run"
              echo
              echo "Missing GitHub Actions secrets (see docs/n8n/DEPLOY.md § GitHub Actions):"
              echo
              for name in "${missing[@]}"; do echo "- \`$name\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install workspace dependencies
        # The script runs the cron tests before it touches the host.
        run: yarn install --frozen-lockfile

      - name: SSH key and pinned host key
        env:
          CRON_SSH_KEY: ${{ secrets.CRON_SSH_KEY }}
          CRON_SSH_KNOWN_HOSTS: ${{ secrets.CRON_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CRON_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$CRON_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          VERIFY_EMAIL: ${{ secrets.CRON_VERIFY_EMAIL }}
        run: |
          export SSH_KEY="$HOME/.ssh/deploy_key"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.check_only }}" = "true" ]; then
            scripts/deploy-cron.sh --check
          else
            scripts/deploy-cron.sh
          fi

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
