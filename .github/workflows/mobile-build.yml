name: Mobile Build (Android + iOS)

on:
  push:
    branches: [master, develop, agents-initial]
    paths:
      - 'apps/web-app/**'
      - 'packages/**'
      - 'apps/android/**'
      - 'apps/ios/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'apps/web-app/**'
      - 'packages/**'
      - 'apps/android/**'
      - 'apps/ios/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Boot emulator/simulator and verify app launches'
        type: boolean
        required: false
        default: true

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'
  RUBY_VERSION: '3.2'
  # Pinned so a runner image bumping Xcode cannot silently break signed builds.
  # Kept identical to release-mobile.yml: if the PR lane and the release lane
  # build with different toolchains, the PR lane goes green on builds the
  # release lane cannot produce. See that file for why this must be a 26.x.
  XCODE_VERSION: '26.2'

jobs:
  build-web:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate runtime config (placeholders for CI)
        working-directory: apps/web-app
        env:
          FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
          FCM_AUTH_DOMAIN: ${{ secrets.FCM_AUTH_DOMAIN }}
          FCM_DATABASE_URL: ${{ secrets.FCM_DATABASE_URL }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_STORAGE_BUCKET: ${{ secrets.FCM_STORAGE_BUCKET }}
          FCM_MESSAGING_SENDER_ID: ${{ secrets.FCM_MESSAGING_SENDER_ID }}
          FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
          FCM_MEASUREMENT_ID: ${{ secrets.FCM_MEASUREMENT_ID }}
          GQL_URL: ${{ secrets.GQL_URL || 'https://api.routine.familywealth.in/graphql' }}
          GA_PUBLIC_KEY: ${{ secrets.GA_PUBLIC_KEY }}
          GA_CLIENT_ID: ${{ secrets.GA_CLIENT_ID }}
          GA_SERVER_CLIENT_ID: ${{ secrets.GA_SERVER_CLIENT_ID }}
          GA_ANDROID_CLIENT_ID: ${{ secrets.GA_ANDROID_CLIENT_ID }}
          GA_IOS_CLIENT_ID: ${{ secrets.GA_IOS_CLIENT_ID }}
          IS_DEVELOPMENT: 'false'
        run: node ./scripts/create-env.js

      - name: Build web app
        run: yarn workspace web-app build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web-app/dist
          retention-days: 7
          if-no-files-found: error

  build-android:
    name: Build Android (debug APK)
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web-app/dist

      - name: Provision google-services.json
        env:
          ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -e
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON_B64 not set; the APK would ship without Firebase and push/sign-in would silently fail"
            exit 1
          fi
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_B64" | base64 --decode > apps/android/app/google-services.json
          echo "Wrote google-services.json from secret"

      # Without this, the Android Gradle Plugin mints a fresh random debug
      # keystore on every ephemeral runner. Each build would then have a
      # different signing SHA-1, and Google Sign-In fails with DEVELOPER_ERROR
      # because that fingerprint is not registered in Firebase — which would
      # make the APKs sent to testers unusable for login.
      - name: Provision stable debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -e
          if [ -z "$ANDROID_DEBUG_KEYSTORE_B64" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_B64 not set; debug builds would get a random signing key and Google Sign-In would break"
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep SHA1:

      - name: Write apps/android/local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > apps/android/local.properties
          cat apps/android/local.properties

      - name: Capacitor sync (android)
        working-directory: apps/web-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Signed release AABs are built and published by release-mobile.yml on a v* tag.
      # This workflow is the pre-merge gate only.

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  smoke-android:
    name: Smoke test Android (boot emulator + launch app)
    needs: build-android
    if: github.event_name != 'workflow_dispatch' || inputs.smoke_test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: artifacts

      - name: Locate APK
        id: locate
        run: |
          APK=$(find artifacts -name '*.apk' -print -quit)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -la artifacts

      - name: Boot emulator and verify app launches
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r "${{ steps.locate.outputs.apk }}"
            adb shell am start -W -n com.routine.note/.MainActivity
            sleep 12
            adb shell dumpsys window windows | grep -E 'mCurrentFocus|mFocusedApp' || true
            adb exec-out screencap -p > app-screenshot.png || true
            bash -c 'PID=$(adb shell pidof com.routine.note 2>/dev/null | tr -d "\r"); if [ -z "$PID" ]; then PID=$(adb shell "ps -A | grep com.routine.note" 2>/dev/null | awk "{print \$2}" | head -1 | tr -d "\r"); fi; if [ -z "$PID" ]; then echo "::error::App process com.routine.note is not running"; adb logcat -d -t 300 "*:E"; exit 1; fi; echo "App is running with PID $PID"; adb logcat -d --pid="$PID" | tail -40 || true'

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-screenshot
          path: app-screenshot.png
          if-no-files-found: warn

  build-ios:
    name: Build iOS (unsigned)
    needs: build-web
    # macos-15, not macos-14: that image tops out at Xcode 16.2 and has no 26.x,
    # so it cannot build with the toolchain the release lane requires.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      # CocoaPods comes from the root Gemfile, pinned to the version in
      # Podfile.lock so CI never resolves a different one than the lockfile.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: apps/ios/App/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/ios/App/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web-app/dist

      - name: Provision GoogleService-Info.plist
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_B64 }}
          PLACEHOLDER_B64: 
        run: |
          set -e
          if [ -n "$IOS_GOOGLE_SERVICE_INFO_PLIST_B64" ]; then
            SOURCE_B64="$IOS_GOOGLE_SERVICE_INFO_PLIST_B64"
            echo "Using GoogleService-Info.plist from secret"
          else
            SOURCE_B64="$PLACEHOLDER_B64"
            echo "::warning::IOS_GOOGLE_SERVICE_INFO_PLIST_B64 not set; using placeholder (Firebase calls will fail at runtime)"
          fi
          printf '%s' "$SOURCE_B64" | base64 --decode > apps/ios/App/App/GoogleService-Info.plist
          ls -la apps/ios/App/App/GoogleService-Info.plist
          head -3 apps/ios/App/App/GoogleService-Info.plist

      - name: Capacitor sync (ios)
        working-directory: apps/web-app
        run: npx cap sync ios

      - name: Pod install
        working-directory: apps/ios/App
        run: bundle exec pod install --repo-update

      - name: Build .app for simulator (unsigned)
        working-directory: apps/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Locate App.app
        id: locate_app
        working-directory: apps/ios/App
        run: |
          APP_PATH=$(find build/Build/Products -name 'App.app' -type d -print -quit)
          echo "Found: $APP_PATH"
          echo "app_path=apps/ios/App/$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload iOS .app (simulator build)
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ${{ steps.locate_app.outputs.app_path }}
          if-no-files-found: error

  smoke-ios:
    name: Smoke test iOS (boot simulator + launch app)
    needs: build-ios
    if: github.event_name != 'workflow_dispatch' || inputs.smoke_test
    # Must match build-ios: a simulator can only run a build made for its own
    # runtime, and macos-14 has no iOS 26 runtime.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download iOS app
        uses: actions/download-artifact@v4
        with:
          name: ios-simulator-app
          path: artifacts/App.app

      - name: List available simulators
        run: xcrun simctl list devices available | head -40

      - name: Boot simulator and verify app launches
        run: |
          set -e
          DEVICE=$(xcrun simctl list devices available -j | \
            python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
              ids=[v['udid'] for k,arr in d.items() if 'iOS' in k for v in arr if v.get('isAvailable') and 'iPhone' in v['name']]; \
              print(ids[0] if ids else '')")
          if [ -z "$DEVICE" ]; then
            # Don't hardcode a model — the device types shipped with each Xcode
            # change every release, and a name that no longer exists makes this
            # fall over exactly when the discovery above has already failed.
            DEVICE_TYPE=$(xcrun simctl list devicetypes -j | \
              python3 -c "import json,sys; t=[d['identifier'] for d in json.load(sys.stdin)['devicetypes'] if 'iPhone' in d['name']]; \
                print(t[-1] if t else '')")
            if [ -z "$DEVICE_TYPE" ]; then
              echo "::error::No iPhone simulator or device type available"
              exit 1
            fi
            echo "No booted iPhone found; creating one from $DEVICE_TYPE"
            DEVICE=$(xcrun simctl create "ci-iphone" "$DEVICE_TYPE")
          fi
          echo "Using simulator: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" artifacts/App.app
          xcrun simctl get_app_container "$DEVICE" com.routine.note app > /dev/null
          echo "App installed successfully"
          LAUNCH_OUT=$(xcrun simctl launch --terminate-running-process "$DEVICE" com.routine.note)
          echo "$LAUNCH_OUT"
          PID=$(echo "$LAUNCH_OUT" | awk -F': ' '/com.routine.note/ {print $2}')
          if [ -z "$PID" ] || [ "$PID" = "0" ]; then
            echo "::error::App did not launch"
            exit 1
          fi
          echo "App launched with PID $PID"
          sleep 8
          STILL_ALIVE=$(xcrun simctl spawn "$DEVICE" launchctl list | grep -i 'com.routine.note' | awk '{print $1}' | head -1)
          if [ -z "$STILL_ALIVE" ] || [ "$STILL_ALIVE" = "-" ]; then
            echo "::error::App crashed within 8s of launch (no live process)"
            xcrun simctl spawn "$DEVICE" log show --last 1m --predicate 'process == "App"' 2>&1 | tail -50 || true
            xcrun simctl io "$DEVICE" screenshot ios-smoke-screenshot.png || true
            exit 1
          fi
          echo "App still alive after 8s (PID $STILL_ALIVE)"
          xcrun simctl io "$DEVICE" screenshot ios-smoke-screenshot.png
          xcrun simctl shutdown "$DEVICE" || true

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-screenshot
          path: ios-smoke-screenshot.png
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # PR distribution — get a testable build into a tester's hands on every PR.
  # Both jobs need repository secrets, which forked PRs never receive.
  # ---------------------------------------------------------------------------

  distribute-android:
    name: Send APK to Firebase App Distribution
    needs: smoke-android
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      # Reuses the exact APK that just passed the emulator smoke test rather
      # than rebuilding — the tester gets the binary CI actually verified.
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: artifacts

      - name: Locate APK
        id: locate
        run: echo "apk=$(find artifacts -name '*.apk' -print -quit)" >> "$GITHUB_OUTPUT"

      - name: Provision Firebase service account
        env:
          FIREBASE_SA_JSON_B64: ${{ secrets.FIREBASE_SA_JSON_B64 }}
        run: printf '%s' "$FIREBASE_SA_JSON_B64" | base64 --decode > "$RUNNER_TEMP/firebase-sa.json"

      - name: Distribute to testers
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SA_PATH: ${{ runner.temp }}/firebase-sa.json
          APK_PATH: ${{ steps.locate.outputs.apk }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bundle exec fastlane android pr_distribute

      - name: Remove service account
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"

  distribute-ios:
    name: Send build to TestFlight
    needs: build-web
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: apps/ios/App/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/ios/App/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # The smoke-test artifact is an unsigned simulator .app and cannot go to
      # TestFlight, so this job archives a real signed device build from scratch.
      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web-app/dist

      - name: Provision GoogleService-Info.plist
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          set -e
          printf '%s' "$IOS_GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > apps/ios/App/App/GoogleService-Info.plist

      - name: Capacitor sync (ios)
        working-directory: apps/web-app
        run: npx cap sync ios

      - name: Pod install
        working-directory: apps/ios/App
        run: bundle exec pod install --repo-update

      - name: Configure match SSH access
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bundle exec fastlane ios pr_testflight
