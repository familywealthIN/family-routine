# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: grvpanchal
service: familywealth-graphql-api

# No `plugins:` block. serverless-offline is the only one this service ever
# declared, and Serverless resolves plugins from apps/server/node_modules —
# where yarn workspaces never put it, since it hoists to the repo root. The
# declaration therefore failed to resolve for every command, deploy included.
# Nothing here runs `serverless offline` (local dev is `yarn dev`, nodemon
# against server.js). To reintroduce it, install it into apps/server itself.

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: false
    platform: node
    target: node18
    external:
      - '@aws-sdk/*'
      - 'aws-sdk'

package:
  patterns:
    - '!**'
    - secrets.json

custom:
  secrets: ${file(secrets.json)}
provider:
  name: aws
  runtime: nodejs18.x
  stage: dev
  region: ap-south-1
  timeout: 120 # increase default lambda timeout from 6s to 120s
  environment:
    MONGDO_DB: ${self:custom.secrets.MONGDO_DB}
    MONGDO_DEBUG: ${self:custom.secrets.MONGDO_DEBUG}
    GOOGLE_CLIENT_ID: ${self:custom.secrets.GOOGLE_CLIENT_ID}
    GOOGLE_CLIENT_KEY: ${self:custom.secrets.GOOGLE_CLIENT_KEY}
    GA_IOS_CLIENT_ID: ${self:custom.secrets.GA_IOS_CLIENT_ID}
    GA_CLIENT_ID: ${self:custom.secrets.GA_CLIENT_ID}
    JWT_SECRET: ${self:custom.secrets.JWT_SECRET}
    DOMAIN: ${self:custom.secrets.DOMAIN}
    ENCRYPTION_KEY: ${self:custom.secrets.ENCRYPTION_KEY}
    GEMINI_API_KEY: ${self:custom.secrets.GEMINI_API_KEY}
    OPENROUTER_API_KEY: ${self:custom.secrets.OPENROUTER_API_KEY}
    # Routine chat runs on OpenRouter's FREE tier only. Comma-separated, every
    # id must carry the `:free` suffix (ids without it are dropped at runtime).
    # Omit to use the built-in roster in src/utils/chatApi.js.
    OPENROUTER_FREE_MODELS: ${self:custom.secrets.OPENROUTER_FREE_MODELS, ''}
    WEB_APP_URL: ${self:custom.secrets.WEB_APP_URL, ''}
    MCP_BASE_URL: ${self:custom.secrets.MCP_BASE_URL}
    # Sender of the missed-days email. SES in ap-south-1 has production access
    # and this address verified; a new sender must be verified there first.
    EMAIL_FROM: ${self:custom.secrets.EMAIL_FROM, 'Routine Notes <noreply@familywealth.in>'}
  iam:
    role:
      statements:
        # Only the missed-days email sends mail, and only as the verified sender.
        - Effect: Allow
          Action:
            - ses:SendEmail
          Resource: arn:aws:ses:${aws:region}:${aws:accountId}:identity/*
          Condition:
            StringEquals:
              ses:FromAddress: noreply@familywealth.in

functions:
  # Hourly: one email to people who missed 3 days of routines
  # (src/jobs/missedDays.js). Dry run: node scripts/preview-missed-email.js
  missedDaysEmail:
    handler: missed-days-email.handler
    timeout: 300
    events:
      - schedule: rate(1 hour)

  query:
    handler: handler.handler
    events:
      - http:
          path: graphql
          method: post
          cors: true

  mcp:
    handler: serverless-mcp.handler
    events:
      - http:
          path: mcp
          method: get
          cors: true
      - http:
          path: mcp/call
          method: post
          cors: true
      - http:
          path: mcp/resources
          method: get
          cors: true
      - http:
          path: mcp/tools
          method: get
          cors: true
      - http:
          path: mcp/graphql
          method: post
          cors: true
